<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SaleFinder - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="box">

        <h1>SaleFinder</h1>

        <p class="subtitle">Find the best deals around you</p>


        <!-- ==============================
             LOGIN FORM
        =============================== -->

        <div id="loginForm">

            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button
                type="button"
                onclick="login()"
            >
                Login
            </button>

            <p class="switch-text">
                Don't have an account?
                <button
                    type="button"
                    class="link-button"
                    onclick="showRegister()"
                >
                    Create Account
                </button>
            </p>

        </div>


        <!-- ==============================
             REGISTER FORM
        =============================== -->

        <div id="registerForm" style="display: none;">

            <input
                id="name"
                type="text"
                placeholder="Name"
                autocomplete="name"
            >

            <input
                id="email"
                type="email"
                placeholder="Email"
                autocomplete="email"
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="new-password"
            >

            <input
                id="phone"
                type="tel"
                placeholder="Phone Number"
                autocomplete="tel"
            >

            <input
                id="city"
                type="text"
                placeholder="City"
                autocomplete="address-level2"
            >

            <select id="role">
                <option value="customer">Customer</option>
                <option value="shopkeeper">Shopkeeper</option>
            </select>

            <button
                type="button"
                onclick="register()"
            >
                Create Account
            </button>

            <p class="switch-text">
                Already have an account?
                <button
                    type="button"
                    class="link-button"
                    onclick="showLogin()"
                >
                    Login
                </button>
            </p>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
