<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet"
          href="login.css">

</head>

<body>

<div class="box">

    <h1>SaleFinder</h1>

    <input id="name"
           placeholder="Name">

    <input id="email"
           type="email"
           placeholder="Email">

    <input id="password"
           type="password"
           placeholder="Password">

    <select id="role">

        <option value="customer">
            Customer
        </option>

        <option value="shopkeeper">
            Shopkeeper
        </option>

    </select>

    <button onclick="register()">
        Create Account
    </button>

    <hr>

    <button onclick="login()">
        Login
    </button>

</div>

<script src="login.js"></script>

</body>
</html>
