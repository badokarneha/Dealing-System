<!DOCTYPE html>
<html>

<head>

    <title>Post Sale</title>

    <link rel="stylesheet"
          href="post sale.css">

</head>

<body>

<div class="form-box">

    <h1>Post Your Sale 📢</h1>

    <form id="saleForm">

        <input id="shop"
               placeholder="Shop name"
               required>

        <input id="title"
               placeholder="Sale title"
               required>

        <input id="category"
               placeholder="Category"
               required>

        <input id="discount"
               type="number"
               placeholder="Discount %"
               required>

        <input id="location"
               placeholder="Shop location"
               required>

        <input id="start"
               type="date"
               required>

        <input id="end"
               type="date"
               required>

        <textarea id="description"
                  placeholder="Describe your sale"
                  required></textarea>

        <button>
            Publish Sale
        </button>

    </form>

</div>

<script src="post sale.js"></script>

</body>
</html>
